earch box looks in every field."]}),(0,k.jsx)(Ft,{rows:[["Add Card","Press Read Card: the camera opens inside the app with a card-shaped outline (the first time, your phone asks once for camera permission). Fill the outline with the card and hold still: the outline turns green and, after one second, the picture is taken by itself (or press Capture at any time). Hold the card close and avoid glare; a dark table helps. Reading takes a few seconds and happens on your device. After a reading only the filled fields are shown; press Show All Fields to see and fill the rest. Check every field \u2014 fields marked \u201Ccheck this\u201D were guessed. You can also paste or type the card text and press Fill In, or press Scan Code for a QR code or badge barcode."],["Card picture","After Read Card, a smaller copy of the card picture is saved with the card. Open the card and press View Card to see it. The same people who can see the card can see the picture. It is removed when the person who saved the card exports it."],["If the camera does not open","If the live camera is not available (or permission was turned down), Read Card offers Take or Choose a Picture instead; the app finds the card in the picture and reads only that part. To allow the camera later, turn it on for the browser in the phone's settings."],["Leaving the form","Back to Previous Page (top right) returns to where you were \u2014 from a show's pop-up, back to that pop-up. If something has been entered and not saved, the button reads Cancel and warns: This card will not be saved if you leave this screen \u2014 Stay Here or Back to Previous Page."],["After Save","The form stays open and shows Saved with the card. Press Add Another Card for the next card (same show), or Back to Previous Page."],["Conference","Added from a show's pop-up: that show. Otherwise the app looks for a show (not cancelled) running today or starting or finishing within 2 days of today. One match fills in; if several match, the card's detail ns) adds or dismisses requests. A new card is filled in with the show running today or within 2 days of its dates (if several, the card's details decide; otherwise blank). After Read Card a smaller copy of the card picture is saved (View Card) until the person who saved the card exports it. The Partnerships section on Overview and Money starts collapsed (new Settings choice to keep it shown). Needs Card_Reader_Step_v3.8.20.sql."},{version:"3.8.19",built:"2026-11-18 12:52 ET",change:"Switch App is now its own Menu item, just above Admin (no longer in the User section). It opens Training Status directly, without Training Status asking which app to open. Shown, as before, only to Admin-tab accounts that also have Training Status access."},{version:"3.8.18",built:"2026-11-15 18:06 ET",change:"Users (owner): new Training Admin tick box for every person, separate from the Admin tab box. Training Admins get Select Trainer(s) in Training Status; the box only matters when Training Status is ticked (it stays clickable, faded, when it is not, and unticking Training Status keeps it). The owner is always a Training Admin. Add a user also has a Training Admin box, usable when Training Status is ticked. Needs Training_Admin_Step_v3.8.18.sql (run 11/15/2026)."},{version:"3.8.17",built:"2026-11-15 17:35 ET",change:"Admin \u2192 Names (owner): each name has a Delete button. It asks first, then removes the name; the email address shows instead of the name everywhere. Addresses still in use (sign-in accounts, attendee lists, notes, contacts) stay on the list with no name. Needs Names_Delete_Rule_v3.8.17.sql (run 11/15/2026)."},{version:"3.8.16",built:"2026-11-15 16:31 ET",change:"Shared access list: the app now opens only for people whose Conference Tracker access is on (checked in the app and in the database). Anyone else is told they do not have access; if they have Training Status access they get a button to open it. Users (owner only) now manages both apps: Conference Tracker and Training Status tick boxes for every person, and new people get only the apps that are ticked. Turning access off never deletes the account. Set as Inactive and Delete Account now say they lock the person out of both apps. Switch App shows only for Admin-tab accounts that also have Training Status access. Needs App_Access_Step_2026-11-15.sql and the v3.3.0 user service (admin-users)."},{version:"3.8.15",built:"2026-11-15 09:17 ET",change:"Switch App: accounts with the Admin tab have a Switch App button in the Menu (User section) that opens the SS Training App in the same tab."},{version:"3.8.14",built:"2026-11-14 16:59 ET",change:"Shows paid through a partnership now say how it was paid: the show pop-up (Partnership payment) and the Money list show the partnership's date paid and payment method, e.g. Paid 03/31/2026 \xB7 Check 6661 \xB7 via Sheriffs' Leadership Institute Platinum Sponsorship. Amounts accounts only; totals unchanged. Benefit-only agreements are not shown, as they pay for no show."},{version:"3.8.13",built:"2026-10-30 07:38 ET",change:"The Overview tiles are now Conferences, Partnerships and Power Recorded (plus Cancelled when the year has one): Paid or Partnership and Awaiting Payment moved to the Money page, and Setup Recorded is gone. Contacts has an Exit button at the top and bottom that returns to the page you came from."},{version:"3.8.12",built:"2026-10-26 05:31 ET",change:"Phone held upright: the page controls are centred and Reset / Reset All sit on their own centred row (sideways, tablet and computer: one row). Notice bars (View As, another year, notes to review) sit above the two filter rows, each on one line; the View As bar reads Viewing: (name) with an Exit View button. The tiles on Overview, Money and Evidence fold to one row (Expand / Collapse), with a new Tiles choice in Settings. Every Admin section folds to its title and starts closed (the notes bar's Open Admin opens Notes to Review). New-user message has a new opening line."},{version:"3.8.11",built:"2026-10-25 22:00 ET",change:"Layout: the dark header now holds only the title row and is shorter (on a phone: the logo beside the title, and the version without the build time \u2014 the build time stays in Admin \u2192 App version). The year buttons, State and My Shows sit on the page just under it on Overview, Money and Evidence (notice bars come after them); below them are the page's own controls (Overview: All / Current, Board / List / Large / Full, Reset; Evidence: List / Large / Full), then Search, then the tiles. New Reset All on Overview, Money and Evidence: puts the year, State, My Shows and every page back to how they open at sign-in with your saved settings (Day / Night is left alone); Reset still clears only the Overview. In View As, Reset All uses the viewed person's own saved settings (needs View_As_Settings_v3.8.11.sql). Users (owner): after Create with Temporary Password or Reset Temporary Password, a ready-to-send message with the app address, the email, the temporary password and first steps, with Copy Message."},{version:"3.8.10",built:"2026-10-24 14:50 ET",change:"Partnership: shows covered by an annual partnership now say Partnership instead of covered or sponsorship \u2014 the Overview tile is Paid or Partnership, the agreements are Partnerships, and Amount paid reads $0.00 \xB7 Partnership (the organizations' own program names are unchanged). Labels, chips and the Board legend use capitals. Years: the header keeps two year buttons; any other year with shows opens from the Menu under Other Years (the next year's list, and past years as history), with a banner and a Back button; it opens the same pages as the year buttons. The owner moves the buttons on in Admin \u2192 Year Buttons once the older year is over. Shows under review (status Review List) stay in the list, highlighted pink. Needs Year_2028_Setup_v3.8.10.sql for the 2028 list."},{version:"3.8.9",built:"2026-10-23 23:05 ET",change:"Day and Night: a Night mode with a very dark grey background and soft white text (coloured labels and the yellow rows for shows without dates have night versions). Choose Day, Night or Automatic in Menu \u2192 Settings \u2014 saved with your account; Automatic follows your phone or computer \u2014 or use the sun / moon button in the header."},{version:"3.8.8",built:"2026-10-21 19:26 ET",change:"After Read Card, Scan Code or Fill In only the filled fields are shown, with Show All Fields (N hidden) to bring back the rest. Each reading is recorded for review \u2014 the text the reader saw (never the picture), what it filled in and what was saved \u2014 in an admin-only table (needs Card_Reads_Setup_v3.8.8.sql). Read Card: the automatic picture locks in more easily (a little more hand movement is allowed and a short shake no longer restarts the one-second count). Card fields: web addresses get www. when the card leaves it out; plural titles such as Board of Supervisors are recognised; an agency printed with its state (COUNTY OF HENRY, VA) is read and tidied; a state written out (Collinsville, Virginia) is understood; a second phone number with no label is filled in as the mobile, and a phone number read with an extra digit is still filled in \u2014 both marked check this."},{version:"3.8.7",built:"2026-10-19 21:39 ET",change:"Read Card reads cards much better (in testing, about 47% of fields right before and 83\u201387% now): the camera takes a sharper picture and keeps focusing, shadows and glare are evened out, coloured bands and dark cards are read, the card is read twice (large and small) and the fields are filled from both, and names, titles, agencies, departments, phone labels (P:, C:, F:), emails and websites are recognised more reliably. Everything still happens on the phone; the picture is never saved or uploaded."},{version:"3.8.6",built:"2026-10-19 20:34 ET",change:"Notes can be edited and deleted: Edit and Delete under each note. Admins can change or delete any note (type and text, and on a closed note its Disposition and Description); everyone else can change or delete their own notes while they are open. Delete removes the note for good after a confirmation. An edited note shows Edited (date) by (name). Needs Notes_Edit_Delete_Setup_v3.8.6.sql."},{version:"3.8.5",built:"2026-10-19 19:48 ET",change:"Each show's Sponsorship Level now shows last year's level beside it (in the pop-up and on Money), for example Gold \xB7 Last year: Silver; search finds it too. Contacts \u2192 Read Card takes the picture by itself: fill the outline with the card and hold still \u2014 the outline turns green and the picture is taken after one second (Capture still works). Needs Previous_Year_Level_Setup_v3.8.5.sql; last year's levels appear once the workbook sends them."},{version:"3.8.4",built:"2026-10-19 06:26 ET",change:"People are shown by name instead of email everywhere \u2014 attendees, who added a contact or note, the user lists, View As (names are kept in the database; the owner edits them in Admin \u2192 Names). Shows without a date are highlighted yellow in every list. In the pop-up, Amount paid reads $0.00 \xB7 Sponsorship when a sponsorship covers the show. The Menu lists Contacts second, after Overview, and the User section has four buttons on two rows: Set Up Face ID / Passkey, Change Password, Settings and Sign Out. Needs People_Names_Setup_v3.8.4.sql for names."},{version:"3.8.3",built:"2026-10-18 20:43 ET",change:"My Settings (Menu \u2192 User): your own defaults, saved with your account \u2014 Overview opens on Current or All, Board / List / Large / Full, Shows by State expanded or collapsed, My Shows on or off, and any number of States. The State filter now takes several states at once. The Overview opens on Current; it gains the Setup Recorded and Power Recorded tiles (two rows of three) and, in each show's pop-up and Large and Full views, who is attending, booth status and last year's dates \u2014 the Logistics page is retired. Money is shown only to accounts with the amounts permission and Evidence only to admins (also in View As). Contacts are grouped by show (each group opens and closes) with a show filter and an Added by list; the pop-up's contact links are now buttons. Phones and tablets: larger text in typing boxes (no more zooming in), the leave-without-saving warning is a centred box, the update bar is short with a What's New box, and button text stays inside its button. Needs User_Settings_Setup_v3.8.3.sql for saving settings."},{version:"3.8.2",built:"2026-10-18 19:15 ET",change:"Contacts: Read Card now opens the camera inside the app with a card-shaped outline; line the card up and tap Capture. Only the part inside the outline is cleaned up and read on the device (the picture is thrown away at once, never saved or uploaded), and unsure words, lowercase slogans and stray marks are left out, so names and titles come through far better. If the live camera is not available, the app falls back to taking or choosing a picture and finds the card in it. The contact form has a Back to Previous Page button (Cancel when something unsaved has been entered, with a warning and Stay Here / Back to Previous Page); from a show's pop-up it returns to that pop-up. After saving, the form shows Saved with the contact and offers Add Another Contact. Every button now capitalises its words except small ones such as a, of, the and to; In and As are capitalised when part of the action (Add Note, Sign In, View As, Fill In \u2026)."},{version:"3.8.1",built:"2026-10-18 16:28 ET",change:"Show pop-up: Contacts from this show and Add contact now sit directly under the show title; a Notes button beside the dates (centred under the Contacts line on a phone) shows how many notes the show has and how many are open, and takes you to the Notes section at the bottom."},{version:"3.8.0",built:"2026-10-18 15:22 ET",change:"Contacts (Menu \u2192 Contacts): add people met at shows from Scan Text / paste, Read card or Scan code (pictures are read on the device and never saved), with Conference, Date met and Reason; a possible duplicate offers to use the existing contact, update it field by field (side by side), or save as new; Visible to Everyone / Only me / Selected users; anyone who can see a contact can edit it, admins delete; Export offers only contacts new or changed since your last export, in one Apple Contacts file or spreadsheet; admins have Backup all. Each show's pop-up shows its contacts and Add contact. Needs Contacts_Setup_v3.8.0.sql."},{version:"3.7.0",built:"2026-10-18 14:19 ET",change:"Conference notes: anyone can add Information or a Request to a show in its pop-up, and everyone sees the show's notes; admins see a count of notes to review (Menu, banner, Admin \u2192 Notes to review) and close each with a disposition (Read NFA, Read NFU, Action Taken) and a short description. Admin \u2192 View as: see the app as another user would (their permissions and My shows), with an Exit button; nothing can be changed while viewing. Needs Notes_ViewAs_Setup_v3.7.0.sql."},{version:"3.6.1",built:"2026-10-18 09:55 ET",change:'Overview: the Paid in full tile is now Paid or covered (paid in full plus shows covered by a sponsorship, e.g. "69 paid \xB7 1 sponsorship"); cancelled shows (payment status Cancelled) leave Awaiting payment / Not yet committed and get their own Cancelled tile, shown only when the year has a cancelled show; with five tiles they sit in one row on a computer or iPad and 3 + 2 on a phone. Money shows a Cancelled tile the same way.'},{version:"3.6.0",built:"2026-10-17 22:44 ET",change:"Sponsorships appear at the bottom of each year on Overview and Money, limited by the filters; the Overview Sponsorships tile (replacing Setup recorded) shows them alone; every tile on every page limits its list and a second tap turns it off (Logistics gains Shows, Dated, Setup recorded and Power recorded tiles; Evidence tiles can be pressed); receipt links: Power receipts for everyone, Receipts for amounts 3.3.0",built:"2026-10-10 10:17 ET",change:"Overview: Show and Display toggles on one row with a Reset button; a Search box below them replaces the Lookup page (both years, year shown on each match); a Shows by state bar chart (press a state to collapse the chart to it and list its shows); Display gains Full (every detail of each show on the page); tiles, chart, list and Next up all reflect the search, pressed tile and pressed state."},{version:"3.2.0",built:"2026-10-10 08:52 ET",change:"Users (owner only): each account shows Active or Inactive with a Set as Inactive / Set as Active button (inactive accounts cannot sign in and sort to the bottom); a Manage button opens Reset temporary password, Change email address and Delete account; needs the v3.2.0 user service in Supabase."},{version:"3.1.1",built:"2026-10-09 22:34 ET",change:"Money tiles are narrower, three to a row on every screen; every tile on Overview and Money reflects the filters in force (State, My shows, a pressed tile, a pressed state bar); a pressed state bar shows a tick and an All states button, and the list heading has a clear button."},{version:"3.1.0",built:"2026-10-09 21:59 ET",change:"Help in the Menu: the User Guide for everyone and the Admin Guide for admin-tab accounts, organised by page."},{version:"3.0.9",built:"2026-10-09 17:31 ET",change:"Header: the menu button always reads Menu; on a phone the Southern Software logo is centred on its own row and the year buttons, State filter and My shows share one row."},{version:"3.0.8",built:"2026-10-09 17:08 ET",change:"Cancelled shows stay in every list and count as before, with a grey Cancelled chip wherever the show appears."},{version:"3.0.7",built:"2026-10-09 13:56 ET",change:"Money tab: every tile can be pressed to limit the list (Overview style); state bars limit to one state; a Conferences tile (default) lists the year's shows with their money, beside Partnership Spending and Component Spending; a show in the list opens its detail pop-up."},
