nger mentions sending a new address after each update (the update bar does that)."},{version:"3.5.0",built:"2026-10-10 14:31 ET",change:"Logistics and Evidence pages: Display List / Large / Full like the Overview; tap a show in List or Large for its detail pop-up. Logistics adds booth exhibit status, venue, last year's dates for undated shows, who is attending and the Attendee Notes. Evidence adds link status, Gmail label and coverage, website review, Conflict Review count and latest entry, and 2027 sponsorship carryover; amounts accounts also see Verified By, Verification Source and Payment Verification."},{version:"3.4.0",built:"2026-10-10 13:08 ET",change:"The app now checks for a newer version (every five minutes and whenever it comes to the front) and shows a bar with the version and its change note; tap it to update. Users: press and hold a user row (or press Manage) to open a window with the Manage actions stacked vertically."},{version:"3.3.1",built:"2026-10-10 12:05 ET",change:"Overview: Current now limits the tiles, the Shows by state chart, the list and Next up to ongoing and upcoming shows, with the completed shows in a Completed section that starts minimised (expand / collapse); the chart starts minimised with an Expand / Collapse button and is not shown with the Board; the Board has its own Collapse / Expand."},{version:"3.3.0",built:"2026-10-10 10:17 ET",change:"Overview: Show and Display toggles on one row with a Reset button; a Search box below them replaces the Lookup page (both years, year shown on each match); a Shows by state bar chart (press a state to collapse the chart to it and list its shows); Display gains Full (every detail of each show on the page); tiles, chart, list and Next up all reflect the search, pressed tile and pressed state."},{version:"3.2.0",built:"2026-10-10 08:52 ET",change:"Users (owner only): each account shows Active or Inactive with a Set as Inactive / Set as Active button (inactive accounts cannot sign in and sort to the bottom); a Manage button opens Reset temporary password, Change email address and Delete account; needs the v3.2.0 user service in Supabase."},{version:"3.1.1",built:"2026-10-09 22:34 ET",change:"Money tiles are narrower, three to a row on every screen; every tile on Overview and Money reflects the filters in force (State, My shows, a pressed tile, a pressed state bar); a pressed state bar shows a tick and an All states button, and the list heading has a clear button."},{version:"3.1.0",built:"2026-10-09 21:59 ET",change:"Help in the Menu: the User Guide for everyone and the Admin Guide for admin-tab accounts, organised by page."},{version:"3.0.9",built:"2026-10-09 17:31 ET",change:"Header: the menu button always reads Menu; on a phone the Southern Software logo is centred on its own row and the year buttons, State filter and My shows share one row."},{version:"3.0.8",built:"2026-10-09 17:08 ET",change:"Cancelled shows stay in every list and count as before, with a grey Cancelled chip wherever the show appears."},{version:"3.0.7",built:"2026-10-09 13:56 ET",change:"Money tab: every tile can be pressed to limit the list (Overview style); state bars limit to one state; a Conferences tile (default) lists the year's shows with their money, beside Partnership Spending and Component Spending; a show in the list opens its detail pop-up."},{version:"3.0.6",built:"2026-10-09 07:12 ET",change:"My Shows button; Attendee Notes in the detail box and on Large cards; Overview opens as a List, tiles filter the lists and Next up, All/Current toggle, and the detail box opens as a pop-up from the Board, List and Large views."},{version:"3.0.5",built:"2026-10-08 22:09 ET",change:"Menu button replaces the tab row, with a User section (Face ID, change password, sign out); company logo in the header; State filter beside the year buttons; Notes renamed Admin Notes; organization and show-page links in the detail box."},{version:"3.0.4",built:"2026-10-08 19:14 ET",change:"State filter (Na
