 in \u2014 both marked check this."},{version:"3.8.7",built:"2026-10-19 21:39 ET",change:"Read Card reads cards much better (in testing, about 47% of fields right before and 83\u201387% now): the camera takes a sharper picture and keeps focusing, shadows and glare are evened out, coloured bands and dark cards are read, the card is read twice (large and small) and the fields are filled from both, and names, titles, agencies, departments, phone labels (P:, C:, F:), emails and websites are recognised more reliably. Everything still happens on the phone; the picture is never saved or uploaded."},{version:"3.8.6",built:"2026-10-19 20:34 ET",change:"Notes can be edited and deleted: Edit and Delete under each note. Admins can change or delete any note (type and text, and on a closed note its Disposition and Description); everyone else can change or delete their own notes while they are open. Delete removes the note for good after a confirmation. An edited note shows Edited (date) by (name). Needs Notes_Edit_Delete_Setup_v3.8.6.sql."},{version:"3.8.5",built:"2026-10-19 19:48 ET",change:"Each show's Sponsorship Level now shows last year's level beside it (in the pop-up and on Money), for example Gold \xB7 Last year: Silver; search finds it too. Contacts \u2192 Read Card takes the picture by itself: fill the outline with the card and hold still \u2014 the outline turns green and the picture is taken after one second (Capture still works). Needs Previous_Year_Level_Setup_v3.8.5.sql; last year's levels appear once the workbook sends them."},{version:"3.8.4",built:"2026-10-19 06:26 ET",change:"People are shown by name instead of email everywhere \u2014 attendees, who added a contact or note, the user lists, View As (names are kept in the database; the owner edits them in Admin \u2192 Names). Shows without a date are highlighted yellow in every list. In the pop-up, Amount paid reads $0.00 \xB7 Sponsorship when a sponsorship covers the show. The Menu lists Contacts second, after Overview, and the User section has four buttons on two rows: Set Up Face ID / Passkey, Change Password, Settings and Sign Out. Needs People_Names_Setup_v3.8.4.sql for names."},{version:"3.8.3",built:"2026-10-18 20:43 ET",change:"My Settings (Menu \u2192 User): your own defaults, saved with your account \u2014 Overview opens on Current or All, Board / List / Large / Full, Shows by State expanded or collapsed, My Shows on or off, and any number of States. The State filter now takes several states at once. The Overview opens on Current; it gains the Setup Recorded and Power Recorded tiles (two rows of three) and, in each show's pop-up and Large and Full views, who is attending, booth status and last year's dates \u2014 the Logistics page is retired. Money is shown only to accounts with the amounts permission and Evidence only to admins (also in View As). Contacts are grouped by show (each group opens and closes) with a show filter and an Added by list; the pop-up's contact links are now buttons. Phones and tablets: larger text in typing boxes (no more zooming in), the leave-without-saving warning is a centred box, the update bar is short with a What's New box, and button text stays inside its button. Needs User_Settings_Setup_v3.8.3.sql for saving settings."},{version:"3.8.2",built:"2026-10-18 19:15 ET",change:"Contacts: Read Card now opens the camera inside the app with a card-shaped outline; line the card up and tap Capture. Only the part inside the outline is cleaned up and read on the device (the picture is thrown away at once, never saved or uploaded), and unsure words, lowercase slogans and stray marks are left out, so names and titles come through far better. If the live camera is not available, the app falls back to taking or choosing a picture and finds the card in it. The contact form has a Back to Previous Page button (Cancel when something unsaved has been entered, with a warning and Stay Here / Back to Previous Page); from a show's pop-up it returns to that pop-up. After saving, the form shows Saved with the contact and offers Add Another Contact. Every button now capitalises its words except small ones such as a, of, the and to; In and As are capitalised when part of the action (Add Note, Sign In, View As, Fill In \u2026)."},{version:"3.8.1",built:"2026-10-18 16:28 ET",change:"Show pop-up: Contacts from this show and Add contact now sit directly under the show title; a Notes button beside the dates (centred under the Contacts line on a phone) shows how many notes the show has and how many are open, and takes you to the Notes section at the bottom."},{version:"3.8.0",built:"2026-10-18 15:22 ET",change:"Contacts (Menu \u2192 Contacts): add people met at shows from Scan Text / paste, Read card or Scan code (pictures are read on the device and never saved), with Conference, Date met and Reason; a possible duplicate offers to use the existing contact, update it field by field (side by side), or save as new; Visible to Everyone / Only me / Selected users; anyone who can see a contact can edit it, admins delete; Export offers only contacts new or changed since your last export, in one Apple Contacts file or spreadsheet; admins have Backup all. Each show's pop-up shows its contacts and Add contact. Needs Contacts_Setup_v3.8.0.sql."},{version:"3.7.0",built:"2026-10-18 14:19 ET",change:"Conference notes: anyone can add Information or a Request to a show in its pop-up, and everyone sees the show's notes; admins see a count of notes to review (Menu, banner, Admin \u2192 Notes to review) and close each with a disposition (Read NFA, Read NFU, Action Taken) and a short description. Admin \u2192 View as: see the app as another user would (their permissions and My shows), with an Exit button; nothing can be changed while viewing. Needs Notes_ViewAs_Setup_v3.7.0.sql."},{version:"3.6.1",built:"2026-10-18 09:55 ET",change:'Overview: the Paid in full tile is now Paid or covered (paid in full plus shows covered by a sponsorship, e.g. "69 paid \xB7 1 sponsorship"); cancelled shows (payment status Cancelled) leave Awaiting payment / Not yet committed and get their own Cancelled tile, shown only when the year has a cancelled show; with five tiles they sit in one row on a computer or iPad and 3 + 2 on a phone. Money shows a Cancelled tile the same way.'},{version:"3.6.0",built:"2026-10-17 22:44 ET",change:"Sponsorships appear at the bottom of each year on Overview and Money, limited by the filters; the Overview Sponsorships tile (replacing Setup recorded) shows them alone; every tile on every page limits its list and a second tap turns it off (Logistics gains Shows, Dated, Setup recorded and Power recorded tiles; Evidence tiles can be pressed); receipt links: Power receipts for everyone, Receipts for amounts accounts, in the show pop-up, on Logistics and on Money."},{version:"3.5.2",built:"2026-10-16 08:13 ET",change:"The possible-conferences box now counts only the year you are viewing and is hidden when that year has none; admins can choose whether the box sits at the top or the bottom of the page (Admin tab \u2192 Display settings)."},{version:"3.5.1",built:"2026-10-11 10:30 ET",change:"Help: new section on adding the app to your iPhone, iPad or Android Home Screen, and a one-time tip on phones and tablets after sign-in that points to it; the app is named SS Conferences everywhere, including the Home Screen icon; the Address note no longer mentions sending a new address after each update (the update bar does that)."},{version:"3.5.0",built:"2026-10-10 14:31 ET",change:"Logistics and Evidence pages: Display List / Large / Full like the Overview; tap a show in List or Large for its detail pop-up. Logistics adds booth exhibit status, venue, last year's dates for undated shows, who is attending and the Attendee Notes. Evidence adds link status, Gmail label and coverage, website review, Conflict Review count and latest entry, and 2027 sponsorship carryover; amounts accounts also see Verified By, Verification Source and Payment Verification."},{version:"3.4.0",built:"2026-10-10 13:08 ET",change:"The app now checks for a newer version (every five minutes and whenever it comes to the front) and shows a bar with the version and its change note; tap it to update. Users: press and hold a user row (or press Manage) to open a window with the Manage actions stacked vertically."},{version:"3.3.1",built:"2026-10-10 12:05 ET",change:"Overview: Current now limits the tiles, the Shows by state chart, the list and Next up to ongoing and upcoming shows, with the completed shows in a Completed section that starts minimised (expand / collapse); the chart starts minimised with an Expand / Collapse button and is not shown with the Board; the Board has its own Collapse / Expand."},{version:"3.3.0",built:"2026-10-10 10:17 ET",change:"Overview: Show and Display toggles on one row with a Reset button; a Search box below them replaces the Lookup page (both years, year shown on each match); a Shows by state bar chart (press a state to collapse the chart to it and list its shows); Display gains Full (every detail of each show on the page); tiles, chart, list and Next up all reflect the search, pressed tile and pressed state."},{version:"3.2.0",built:"2026-10-10 08:52 ET",change:"Users (owner only): each account shows Active or Inactive with a Set as Inactive / Set as Active button (inactive accounts cannot sign in and sort to the bottom); a Manage button opens Reset temporary password, Change email address and Delete account; needs the v3.2.0 user service in Supabase."},{version:"3.1.1",built:"2026-10-09 22:34 ET",change:"Money tiles are narrower, three to a row on every screen; every tile on Overview and Money reflects the filters in force (State, My shows, a pressed tile, a pressed state bar); a pressed state bar shows a tick and an All states button, and the list heading has a clear button."},{version:"3.1.0",built:"2026-10-09 21:59 ET",change:"Help in the Menu: the User Guide for everyone and the Admin Guide for admin-tab accounts, organised by page."},{version:"3.0.9",built:"2026-10-09 17:31 ET",change:"Header: the menu button always reads Menu; on a phone the Southern Software logo is centred on its own row and the year buttons, State filter and My shows share one row."},{version:"3.0.8",built:"2026-10-09 17:08 ET",change:"Cancelled shows stay in every list and count as before, with a grey Cancelled chip wherever the show appears."},{version:"3.0.7",built:"2026-10-09 13:56 ET",change:"Money tab: every tile can be pressed to limit the list (Overview style); state bars limit to one state; a Conferences tile (default) lists the year's shows with their money, beside Partnership Spending and Component Spending; a show in the list opens its detail pop-up."},{version:"3.0.6",built:"2026-10-09 07:12 ET",change:"My Shows button; Attendee Notes in the detail box and on Large cards; Overview opens as a List, tiles filter the lists and Next up, All/Current toggle, and the detail box opens as a pop-up from the Board, List and Large views."},{version:"3.0.5",built:"2026-10-08 22:09 ET",change:"Menu button replaces the tab row, with a User section (Face ID, change password, sign out); company logo in the header; State filter beside the year buttons; Notes renamed Admin Notes; organization and show-page links in the detail box."},{version:"3.0.4",built:"2026-10-08 19:14 ET",change:"State filter (National shows also under their host state); owner Users page (add, access, turn off/on, change log); change password."},{version:"3.0.3",built:"2026-10-07 19:08 ET",change:"Keep me signed in on approved devices until the next update; Face ID / passkey sign-in."},{version:"3.0.2",built:"2026-10-07 17:51 ET",change:"Admin tab: installed and previous app version, installed and previous data load with row counts, load history."},{version:"3.0.1",built:"2026-10-04 08:26 ET",change:"New app icons (180, 192 and 512 pixels)."},{version:"3.0.0",built:"2026-10-02 06:20 ET",change:
