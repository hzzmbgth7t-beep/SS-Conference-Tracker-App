earch box looks in every field."]}),(0,k.jsx)(Ft,{rows:[["Add Card","Press Read Card: the camera opens inside the app with a card-shaped outline (the first time, your phone asks once for camera permission). Fill the outline with the card and hold still: the outline turns green and, after one second, the picture is taken by itself (or press Capture at any time). Hold the card close and avoid glare; a dark table helps. Reading takes a few seconds and happens on your device. After a reading only the filled fields are shown; press Show All Fields to see and fill the rest. Check every field \u2014 fields marked \u201Ccheck this\u201D were guessed. You can also paste or type the card text and press Fill In, or press Scan Code for a QR code or badge barcode."],["Card picture","After Read Card, a smaller copy of the card picture is saved with the card. Open the card and press View Card to see it. The same people who can see the card can see the picture. It is removed when the person who saved the card exports it."],["If the camera does not open","If the live camera is not available (or permission was turned down), Read Card offers Take or Choose a Picture instead; the app finds the card in the picture and reads only that part. To allow the camera later, turn it on for the browser in the phone's settings."],["Leaving the form","Back to Previous Page (top right) returns to where you were \u2014 from a show's pop-up, back to that pop-up. If something has been entered and not saved, the button reads Cancel and warns: This card will not be saved if you leave this screen \u2014 Stay Here or Back to Previous Page."],["After Save","The form stays open and shows Saved with the card. Press Add Another Card for the next card (same show), or Back to Previous Page."],["Conference","Added from a show's pop-up: that show. Otherwise the app looks for a show (not cancelled) running today or starting or finishing within 2 days of today. One match fills in; if several match, the card's detail -21 16:08 ET",change:"Contacts is now the Card Reader (Menu, page, show pop-up: Cards from This Show / Add Card). After opening the app, two tiles: Card Reader or Conference App. The Card Reader Menu item shows two counts: your cards not yet exported (mine) and all cards you can see not yet exported (all). Reason list: Organization Member added; Other lets you type a reason \u2014 admins can Add to the List or Use Once, others Use Once and may send a request; Admin \u2192 Reason Requests (all admins) adds or dismisses requests. A new card is filled in with the show running today or within 2 days of its dates (if several, the card's details decide; otherwise blank). After Read Card a smaller copy of the card picture is saved (View Card) until the person who saved the card exports it. The Partnerships section on Overview and Money starts collapsed (new Settings choice to keep it shown). Needs Card_Reader_Step_v3.8.20.sql."},{version:"3.8.19",built:"2026-11-18 12:52 ET",change:"Switch App is now its own Menu item, just above Admin (no longer in the User section). It opens Training Status directly, without Training Status asking which app to open. Shown, as before, only to Admin-tab accounts that also have Training Status access."},{version:"3.8.18",built:"2026-11-15 18:06 ET",change:"Users (owner): new Training Admin tick box for every person, separate from the Admin tab box. Training Admins get Select Trainer(s) in Training Status; the box only matters when Training Status is ticked (it stays clickable, faded, when it is not, and unticking Training Status keeps it). The owner is always a Training Admin. Add a user also has a Training Admin box, usable when Training Status is ticked. Needs Training_Admin_Step_v3.8.18.sql (run 11/15/2026)."},{version:"3.8.17",built:"2026-11-15 17:35 ET",change:"Admin \u2192 Names (owner): each name has a Delete button. It asks first, then removes the name; the email address shows instead of the name everywhere. Addresses still in use (sign-in accounts, attendee lists, notes, contacts) stay on the list with no name. Needs Names_Delete_Rule_v3.8.17.sql (run 11/15/2026)."},{version:"3.8.16",built:"2026-11-15 16:31 ET",change:"Shared access list: the app now opens only for people whose Conference Tracker access is on (checked in the app and in the database). Anyone else is told they do not have access; if they have Training Status access they get a button to open it. Users (owner only) now manages both apps: Conference Tracker and Training Status tick boxes for every person, and new people get only the apps that are ticked. Turning access off never deletes the account. Set as Inactive and Delete Account now say they lock the person out of both apps. Switch App shows only for Admin-tab accounts that also have Training Status access. Needs App_Access_Step_2026-11-15.sql and the v3.3.0 user service (admin-users)."},{version:"3.8.15",built:"2026-11-15 09:17 ET",change:"Switch App: accounts with the Admin tab have a Switch App button in the Menu (User section) that opens the SS Training App in the same tab."},{version:"3.8.14",built:"2026-11-14 16:59 ET",change:"Shows paid through a partnership now say how it was paid: the show pop-up (Partnership payment) and the Money list show the partnership's date paid and payment method, e.g. Paid 03/31/2026 \xB7 Check 6661 \xB7 via Sheriffs' Leadership Institute Platinum Sponsorship. Amounts accounts only; totals unchanged. Benefit-only agreements are not shown, as they pay for no show."},{version:"3.8.13",built:"2026-10-30 07:38 ET",change:"The Overview tiles are now Conferences, Partnerships and Power Recorded (plus Cancelled when the year has one): Paid or Partnership and Awaiting Payment moved to the Money page, and Setup Recorded is gone. Contacts has an Exit button at the top and bottom that returns to the page you came from."},{version:"3.8.12",built:"2026-10-26 05:31 ET",change:"Phone held upright: the page controls are centred and Reset / Reset All sit on their own centred row (sideways, tablet and computer: one row). Notice bars (View As, another year, notes to review) sit above the two filter rows, each on one line; the View As bar reads Viewing: (name) with an Exit View button. The tiles on Overview, Money and Evidence fold to one row (Expand / Collapse), with a new Tiles choice in Settings. Every Admin section folds to its title and starts closed (the notes bar's Open Admin opens Notes to Review). New-user message has a new opening line."},{version:"3.8.11",built:"2026-10-25 22:00 ET",change:"Layout: the dark header now holds only the title row and is shorter (on a phone: the logo beside the title, and the version without the build time \u2014 the build time stays in Admin \u2192 App version). The year buttons, State and My Shows sit on the page just under it on Overview, Money and Evidence (notice bars come after them); below them are the page's own controls (Overview: All / Current, Board / List / Large / Full, Reset; Evidence: List / Large / Full), then Search, then the tiles. New Reset All on Overview, Money and Evidence: puts the year, State, My Shows and every page back to how they open at sign-in with your saved settings (Day / Night is left alone); Reset still clears only the Overview. In View As, Reset All uses the viewed person's own saved settings (needs View_As_Settings_v3.8.11.sql). Users (owner): after Create with Temporary Password or Reset Temporary Password, a ready-to-send message with the app address, the email, the temporary password and first steps, with Copy Message."},{version:"3.8.10",built:"2026-10-24 14:50 ET",change:"Partnership: shows covered by an annual partnership now say Partnership instead of covered or sponsorship \u2014 the Overview tile is Paid or Partnership, the agreements are Partnerships, and Amount paid reads $0.00 \xB7 Partnership (the organizations' own program names are unchanged). Labels, chips and the Board legend use capitals. Years: the header keeps two year buttons; , coloured bands and dark cards are read, the card is read twice (large and small) and the fields are filled from both, and names, titles, agencies, departments, phone labels (P:, C:, F:), emails and websites are recognised more reliably. Everything still happens on the phone; the picture is never saved or uploaded."},{version:"3.8.6",built:"2026-10-19 20:34 ET",change:"Notes can be edited and deleted: Edit and Delete under each note. Admins can change or delete any note (type and text, and on a closed note its Disposition and Description); everyone else can change or delete their own notes while they are open. Delete removes the note for good after a confirmation. An edited note shows Edited (date) by (name). Needs Notes_Edit_Delete_Setup_v3.8.6.sql."},{version:"3.8.5",built:"2026-10-19 19:48 ET",change:"Each show's Sponsorship Level now shows last year's level beside it (in the pop-up and on Money), for example Gold \xB7 Last year: Silver; search finds it too. Contacts \u2192 Read Card takes the picture by itself: fill the outline with the card and hold still \u2014 the outline turns green and the picture is taken after one second (Capture still works). Needs Previous_Year_Level_Setup_v3.8.5.sql; last year's levels appear once the workbook sends them."},{version:"3.8.4",built:"2026-10-19 06:26 ET",change:"People are shown by name instead of email everywhere \u2014 attendees, who added a contact or note, the user lists, View As (names are kept in the database; the owner edits them in Admin \u2192 Names). Shows without a date are highlighted yellow in every list. In the pop-up, Amount paid reads $0.00 \xB7 Sponsorship when a sponsorship covers the show. The Menu lists Contacts second, after Overview, and the User section has four buttons on two rows: Set Up Face ID / Passkey, Change Password, Settings and Sign Out. Needs People_Names_Setup_v3.8.4.sql for names."},{version:"3.8.3",built:"2026-10-18 20:43 ET",change:"My Settings (Menu \u2192 User): your own defaults,
